name: CI/CD Pipeline Part 3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dockerized Go tests
        run: |
          set -o pipefail
          docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from tests 2>&1 | tee unit-tests.log

      - name: Stop unit test stack
        if: always()
        run: docker compose -f compose.test.yml down --remove-orphans

      - name: Integration tests (CRUD, DynamoDB, S3)
        run: |
          set -o pipefail
          python3 scripts/integration_test.py 2>&1 | tee integration-tests.log

      - name: Workflow summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo '## CI/CD Pipeline Part 3'
            echo "- Status: $RESULT"
            echo '- Checks: Docker Compose, Go unit tests, REST CRUD, DynamoDB and S3'
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '### Test output'
            echo '```'
            (grep -E 'PASS|FAIL|^ok |^Error:|^FAIL' unit-tests.log integration-tests.log 2>/dev/null || true) | tail -n 35
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo 'Slack webhook not configured. Set the SLACK_WEBHOOK_URL repository secret.'
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OUTPUT=$( (grep -E 'PASS|FAIL|^ok |^Error:' unit-tests.log integration-tests.log 2>/dev/null || true) | tail -n 25 | cut -c 1-180 )
          PAYLOAD=$(jq -n --arg status "$RESULT" --arg url "$RUN_URL" --arg output "$OUTPUT" \
            '{text: ("CI/CD Part 3: " + $status + "\nRun: " + $url + "\nTest results:\n" + $output)}')
          curl -fsS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
